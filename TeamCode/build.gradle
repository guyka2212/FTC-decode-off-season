apply plugin: 'com.android.application'
// ADD THIS for Kotlin support
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    // REQUIRED: Panels needs SDK 35
    compileSdk 35

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // REQUIRED: Fixes "More than one file was found with OS independent path" errors
    packagingOptions {
        jniLibs.useLegacyPackaging true
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation project(':FtcRobotController')

    // ADD THIS: The Panels Library
    // Replace '1.0.12' with the version listed in the docs if it has changed
    implementation "com.bylazar:fullpanels:1.0.12"

    // Standard FTC dependencies (usually already here)
    implementation 'org.firstinspires.ftc:RobotCore:9.0.1'
    implementation 'org.firstinspires.ftc:Hardware:9.0.1'
    implementation 'org.firstinspires.ftc:FtcCommon:9.0.1'
}